<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>上傳管理 · IPA Mods</title><link rel="stylesheet" href="style.css"></head><body><main><header><b>上傳管理</b><a href="./">回展示櫃 ↗</a></header><h1>發布作品</h1><p class="muted">選擇 IPA，填好介紹，即可發布到展示櫃。</p><form id="form"><label>GitHub Token<input id="token" type="password" required autocomplete="off" placeholder="貼上具有此 repository 寫入權限的 Token"></label><p class="hint">Token 只在這次操作中使用，不會儲存在網站或瀏覽器。僅有 repository 寫入權限的人可發布。</p><label>App Store 連結（選填）<input id="store" type="url" placeholder="https://apps.apple.com/tw/app/…/id123456"></label><button id="lookup" type="button">帶入 App 資料</button><p id="lookup-status" role="status"></p><div id="store-preview"></div><label>作品名稱<input id="title" required maxlength="100" placeholder="例如：My App Mod"></label><label>版本<input id="version" required maxlength="50" placeholder="例如：1.0.0"></label><label>功能介紹與安裝說明<textarea id="description" required rows="7" maxlength="20000" placeholder="修改功能、適用的 iOS 版本、安裝方式…"></textarea></label><label>作品截圖（選填，PNG / JPG / WebP，最多 5 MiB）<input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label><label>IPA 檔案<input id="ipa" type="file" accept=".ipa" required></label><button id="submit">上傳並發布</button><progress id="progress" max="100" value="0" hidden></progress><p id="status" role="status" aria-live="polite"></p><a id="result" hidden></a></form></main><script src="admin.js" type="module"></script></body></html>
